name: Deploy to Production VPS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Run Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-mock

      - name: Run Pytest
        run: |
          python -m pytest tests/ -v

  deploy-webhook:
    name: Trigger VPS Auto-Deploy Webhook
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Webhook
        env:
          WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET || 'surveyorportal-deploy-2026' }}
        run: |
          PAYLOAD='{"ref":"refs/heads/main","event":"push"}'
          SIGNATURE="sha256=$(echo -n "$PAYLOAD" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" | sed 's/^.* //')"
          
          echo "Sending deployment trigger to https://skinsurance.tech/api/deploy-webhook..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature-256: $SIGNATURE" \
            -d "$PAYLOAD" \
            https://skinsurance.tech/api/deploy-webhook)
          
          echo "$RESPONSE"
          HTTP_CODE=$(echo "$RESPONSE" | grep "HTTP_STATUS" | cut -d: -f2)
          
          if [ "$HTTP_CODE" -eq 200 ] || [ "$HTTP_CODE" -eq 202 ]; then
            echo "Deployment webhook triggered successfully!"
          else
            echo "Webhook trigger returned HTTP $HTTP_CODE"
          fi
